name: Build PicDrawer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack latest PicDrawer
        run: |
          ZIP=$(ls PicDrawer-Android-v*.zip | sort -V | tail -n 1)
          test -n "$ZIP"
          echo "Building $ZIP"
          unzip -q "$ZIP" -d appsrc

      - name: Build APK
        run: gradle --no-daemon -p appsrc :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PicDrawer-v0.8-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
